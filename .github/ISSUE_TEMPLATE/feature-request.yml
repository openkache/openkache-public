name: Feature request
description: Propose a user-focused improvement to OpenKache.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to propose an improvement.

        Do not include credentials, tokens, private keys, customer data, or other secrets. For a security vulnerability, [email the security contact privately](mailto:security@openstd.com) instead of opening a public issue.
  - type: textarea
    id: problem_statement
    attributes:
      label: Problem statement
      description: What user or operator problem would this solve? Describe the current limitation and who experiences it.
      placeholder: Explain the concrete problem and its impact.
    validations:
      required: true
  - type: textarea
    id: proposed_outcome
    attributes:
      label: Proposed outcome
      description: Describe the user-visible behavior or result you want, without prescribing implementation details.
      placeholder: Explain what users should be able to do or observe.
    validations:
      required: true
  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance criteria
      description: List observable conditions that would show this request is complete.
      placeholder: |
        - Users can ...
        - The response or behavior is ...
        - Existing behavior remains ...
    validations:
      required: true
  - type: textarea
    id: alternatives_and_impact
    attributes:
      label: Alternatives and impact
      description: Note relevant alternatives, compatibility concerns, operational effects, or resource tradeoffs.
      placeholder: Describe alternatives considered and any compatibility or operational constraints.
  - type: textarea
    id: additional_context
    attributes:
      label: Additional context
      description: Add a focused use case, example, or safe-to-share reference that clarifies the request.
      placeholder: Include only information that is safe to share publicly.
  - type: checkboxes
    id: safe_to_share
    attributes:
      label: Safe to share
      options:
        - label: I have removed credentials, tokens, private keys, customer data, and other sensitive information.
          required: true
